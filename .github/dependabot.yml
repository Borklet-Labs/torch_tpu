# This file is used to configure Dependabot.
# We do not use dependabot but there doesn't seem to be a good way to turn it
# off, so this is designed to never find any updates to prevent it from spamming
# us with PRs we don't want.
# TODO(b/498208430): Determine if we can or want to use dependabot in the future
version: 2
updates:
  - package-ecosystem: "github-actions"
    schedule:
      interval: "monthly"
    # Configure this look for updates in a directory that doesn't exist and
    # target a branch that doesn't exist, so that it never finds anything
    # to update.
    directory: "/non-existent-directory"
    target-branch: "non-existent-branch"
    open-pull-requests-limit: 0
