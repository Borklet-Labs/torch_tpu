name: "Lint checks"

on:
  # Add a workflow dispatch to enable halting for remote connections
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}


jobs:
  run_tests:
    name: "Lint check on ${{ matrix.job_info.runner }}"
    strategy:
      matrix:
        job_info:
          [
            {
              runner: "linux-x86-n2-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest",
            },
          ]
    # Use self-hosted runners. For a Linux runner, a corresponding container
    # image used for the workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    steps:
      - name: "Check out code"
        uses: "actions/checkout@v5"
      - name: "Set up Go"
        uses: "actions/setup-go@v5"
        with:
          go-version: "1.24"
          cache: true
      # If halting was requested, wait for remote connection
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: "Wait For Connection"
        uses: "google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d"
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: "Validate License Headers"
        shell: "bash"
        run: |
          go run github.com/google/addlicense@v1.1.1 -check -s=only .
      - name: "Validate Commit Messages"
        if: (success() || failure()) && github.event_name == 'pull_request'
        shell: "bash"
        run: |
          # Fix dubious ownership issue in Actions containers
          git config --global --add safe.directory '*'

          # Get the exact number of commits in the PR to minimize git fetch depth
          PR_COMMITS="${{ github.event.pull_request.commits }}"
          PR_COMMITS="${PR_COMMITS:-0}"

          # Fetch the PR branch head and the base commit to establish the commit range
          git fetch --no-tags --depth=$((PR_COMMITS + 1)) origin "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

          # Get commit messages between base and head of the pull request
          commit_msgs=$(git log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --format=%B)

          if echo "$commit_msgs" | grep -qF "[NO DESCRIPTION SET]"; then
            echo "::error::Found '[NO DESCRIPTION SET]' in one or more commit messages."
            exit 1
          fi
          echo "Commit messages look good."
