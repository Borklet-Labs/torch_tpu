name: Run Benchmarks

on:
  # Allow manual runs from the Actions tab for testing
  workflow_dispatch:
    inputs:
      ab_mode:
        description: "Run A/B comparison (baseline vs experiment)."
        required: false
        type: boolean
        default: false
      baseline_ref:
        description: "Git ref for the baseline in A/B mode. Defaults to PR base or main."
        required: false
        type: string
        default: ""
      experiment_ref:
        description: "Git ref for the experiment in A/B mode. Defaults to current commit SHA."
        required: false
        type: string
        default: ""
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'test_qwen3.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'tpu-v7.*')."
        required: false
        type: string
        default: ""

  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day

permissions:
  contents: read
  pull-requests: write

jobs:
  run_benchmarks:
    name: Run TorchTPU benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@bd952b0063be0b4169f698947792d203ab5f5c42 # main
    with:
      registry_file: "examples/benchmarks/benchmark_registry.pbtxt"
      bap_ref: "bd952b0063be0b4169f698947792d203ab5f5c42"
      publish_metrics: true
      pub_sub_gcp_project_id: "ml-oss-benchmarking-production"
      pub_sub_gcp_topic_id: "private-torch-tpu-prod"
      runner: "linux-x86-n4-16"
      ab_mode: ${{ inputs.ab_mode }}
      baseline_ref: ${{ inputs.baseline_ref }}
      experiment_ref: ${{ inputs.experiment_ref }}
      benchmark_filter: ${{ inputs.benchmark_filter }}
      environment_filter: ${{ inputs.environment_filter }}
