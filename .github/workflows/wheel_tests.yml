name: Wheel Test

on:
  workflow_call:
    # This allows the workflow to be called by others workflows
    # You can also define inputs if the test job needs the artifact name
    inputs:
      gcs-path:
        required: true
        type: string
      halt-for-connection:
        required: false
        type: string
        default: "no"


# Cancel old jobs when they are replaced by new runs
concurrency:
  group: wheel-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  test_wheels:
    name: Test wheel on ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: CPU
            runner: linux-x86-n2-16
            tag: oss_ready_cpu
            extra_flags: "--config=wheel_test_cpu"
          - name: TPU
            runner: linux-x86-ct5lp-224-8tpu
            tag: oss_ready_tpu
            extra_flags: '--config=wheel_test_tpu --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
    runs-on: ${{ matrix.runner }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          gcloud storage cp "${{ inputs.gcs-path }}/*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run tests
        shell: bash
        run: |
          bazel test ${{ matrix.extra_flags }} \
            -- $(bazel query 'kind("(py_test|torch_tpu_py_test) rule", attr(tags, "${{ matrix.tag }}", //...))')
