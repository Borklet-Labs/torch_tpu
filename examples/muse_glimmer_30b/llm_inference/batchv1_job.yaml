# Public Reference Kubernetes Job manifest for single-device Muse Glimmer 30B LLM inference on TPU v7x
# Slice topology: 2x2x1 (1 physical VM / 4 TPU chips)
#
# Settings to customize:
# - cloud.google.com/gke-nodepool: Name of your GKE 4-chip TPU node pool (e.g. torchtpu-v7x-4chip-pool).
# - image: TorchTPU Docker image URI in Artifact Registry.
# - command args: customize launch.sh options (e.g. "bash ./launch.sh dynamic", "bash ./launch.sh static --random-weights").

apiVersion: batch/v1
kind: Job
metadata:
  name: muse-glimmer-inference
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: torchtpu-v7x-4chip-pool  # <-NB! Update to your nodepool!
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - {effect: NoSchedule, key: "google.com/tpu", operator: Exists}
      containers:
      - name: muse-glimmer-inference
        image: us-docker.pkg.dev/ml-oss-artifacts-published/torch-tpu-public-release-container/torch-tpu:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          cd /workspace/examples/muse_glimmer_30b/llm_inference || cd examples/muse_glimmer_30b/llm_inference
          bash ./launch.sh
        resources: {limits: {google.com/tpu: "4"}, requests: {google.com/tpu: "4"}}
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - {name: dshm, emptyDir: {medium: Memory}}
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
  backoffLimit: 2
  ttlSecondsAfterFinished: 900
