apiVersion: batch/v1
kind: Job
metadata:
  name: muse-glimmer-fsdp-trainloop
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: torchtpu-v7x-4chip-pool  # <-NB! Update to your nodepool!
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - {effect: NoSchedule, key: "google.com/tpu", operator: Exists}
      containers:
      - name: muse-glimmer-fsdp-trainloop
        image: us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torch-tpu:nightly
        command: ["/bin/sh", "-c"]
        args:
        - |
          cd examples/muse_glimmer_30b/
          python3 -m pure_pytorch_fsdp_trainloop.launcher
        resources: {limits: {google.com/tpu: "4"}, requests: {google.com/tpu: "4"}}
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - {name: dshm, emptyDir: {medium: Memory}}
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
  backoffLimit: 2
  ttlSecondsAfterFinished: 900