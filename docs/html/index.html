    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

itle{\n    font-family:'Inter',system-ui,sans-serif;\n    font-weight:600;font-size:1.1em;margin-bottom:6px;\n}\n.card-desc{\n    font-family:'Inter',system-ui,sans-serif;\n    font-size:.92em;opacity:.65;line-height:1.6;margin:0;\n}\n/* Editor-only styles to remove cell gaps */\nmarimo-cell {\n    margin: 0 !important;\n    padding: 0 !important;\n    border: none !important;\n    box-shadow: none !important;\n    background: transparent !important;\n}\n.marimo-output-area { margin: 0 !important; padding: 0 !important; }\n/* Remove overarching container padding so nav is flush with top */\n#root main, #root \u003E div, #root \u003E main \u003E div, .py-8, .pt-8 {\n    padding-top: 0 !important;\n    margin-top: 0 !important;\n}\n\u003C/style\u003E\n\u003Cscript\u003E\n(function() {\n    const isStatic = () =\u003E {\n        return window.location.pathname.endsWith('.html') || \n               window.location.protocol === 'file:' ||\n               (!window.location.search.includes('access_token') \u0026\u0026 window.location.hostname !== 'localhost');\n    };\n\n    if (isStatic()) {\n        const rewrite = (a) =\u003E {\n            const href = a.getAttribute('href');\n            if (href \u0026\u0026 href.startsWith('?file=') \u0026\u0026 href.endsWith('.py')) {\n                a.href = href.replace('?file=', '').replace('.py', '.html');\n            }\n        };\n\n        const observer = new MutationObserver((mutations) =\u003E {\n            mutations.forEach(m =\u003E {\n                m.addedNodes.forEach(node =\u003E {\n                    if (node.nodeType === 1) {\n                        if (node.tagName === 'A') rewrite(node);\n                        node.querySelectorAll('a[href^=\"?file=\"]').forEach(rewrite);\n                    }\n                });\n            });\n        });\n\n        observer.observe(document.body, { childList: true, subtree: true });\n        document.querySelectorAll('a[href^=\"?file=\"]').forEach(rewrite);\n        // Interval fallback for extremely late renders\n        setInterval(() =\u003E {\n            document.querySelectorAll('a[href^=\"?file=\"]').forEach(rewrite);\n        }, 2000);\n    }\n})();\n\u003C/script\u003E\n\u003Cmarimo-nav-menu data-items='[{\u0026quot;label\u0026quot;:\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;iconify-icon icon=\u0026#x27;lucide:graduation-cap\u0026#x27; inline\u0026gt;\u0026lt;/iconify-icon\u0026gt; Tutorials\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;,\u0026quot;href\u0026quot;:\u0026quot;#tutorials\u0026quot;,\u0026quot;description\u0026quot;:null},{\u0026quot;label\u0026quot;:\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;iconify-icon icon=\u0026#x27;lucide:wrench\u0026#x27; inline\u0026gt;\u0026lt;/iconify-icon\u0026gt; How-to Guides\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;,\u0026quot;href\u0026quot;:\u0026quot;#guides\u0026quot;,\u0026quot;description\u0026quot;:null},{\u0026quot;label\u0026quot;:\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;iconify-icon icon=\u0026#x27;lucide:book-open\u0026#x27; inline\u0026gt;\u0026lt;/iconify-icon\u0026gt; Reference\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;,\u0026quot;href\u0026quot;:\u0026quot;#reference\u0026quot;,\u0026quot;description\u0026quot;:null},{\u0026quot;label\u0026quot;:\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;iconify-icon icon=\u0026#x27;lucide:brain\u0026#x27; inline\u0026gt;\u0026lt;/iconify-icon\u0026gt; Explanation\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;,\u0026quot;href\u0026quot;:\u0026quot;#explanation\u0026quot;,\u0026quot;description\u0026quot;:null}]' data-orientation='\u0026quot;horizontal\u0026quot;'\u003E\u003C/marimo-nav-menu\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"portal-hero\"\u003E\n    \u003Ch1 style=\"text-align: center;\"\u003E\ud83d\ude80 TorchTPU Interactive Portal\u003C/h1\u003E\n    \u003Cp class=\"subtitle\" style=\"text-align: center;\"\u003EYour hub for using PyTorch on Google's TPUs.\u003C/span\u003E\n    \u003Cdiv class=\"tip\"\u003E\ud83d\udca1 Run \u003Ccode\u003Emarimo edit tutorials/\u003C/code\u003E to browse all notebooks\u003C/div\u003E\n\u003C/div\u003E\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003E\u2699\ufe0f Installation \u2014 Set up TorchTPU on your TPU VM\u003C/strong\u003E\u003C/summary\u003E\n\nInstall TorchTPU and its dependencies on your TPU VM. Components must be installed in this order to ensure the PyTorch dispatcher and TPU drivers align correctly.\n\n### Step 1: Initialize Python 3.12\n\n\u003Cdiv class=\"language-bash codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Esudo\u003Cspan class=\"w\"\u003E \u003C/span\u003Eapt\u003Cspan class=\"w\"\u003E \u003C/span\u003Eupdate\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026amp;\u0026amp;\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Esudo\u003Cspan class=\"w\"\u003E \u003C/span\u003Eapt\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003E-y\u003Cspan class=\"w\"\u003E \u003C/span\u003Epython3.12\u003Cspan class=\"w\"\u003E \u003C/span\u003Epython3.12-venv\npython3.12\u003Cspan class=\"w\"\u003E \u003C/span\u003E-m\u003Cspan class=\"w\"\u003E \u003C/span\u003Evenv\u003Cspan class=\"w\"\u003E \u003C/span\u003Eenv\n\u003Cspan class=\"nb\"\u003Esource\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Eenv/bin/activate\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\n### Step 2: Install TorchTPU \u0026 Dependencies\n\n\u003Cdiv class=\"language-bash codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"c1\"\u003E# 1. Authenticate to get access to whl\u003C/span\u003E\npip\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003Ekeyrings.google-artifactregistry-auth\ngcloud\u003Cspan class=\"w\"\u003E \u003C/span\u003Eauth\u003Cspan class=\"w\"\u003E \u003C/span\u003Elogin\ngcloud\u003Cspan class=\"w\"\u003E \u003C/span\u003Eauth\u003Cspan class=\"w\"\u003E \u003C/span\u003Eapplication-default\u003Cspan class=\"w\"\u003E \u003C/span\u003Elogin\n\n\u003Cspan class=\"c1\"\u003E# 2. Install torch_tpu, PyTorch 2.10 CPU will install automatically, do not install manually.\u003C/span\u003E\npip\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003E--pre\u003Cspan class=\"w\"\u003E \u003C/span\u003E--index-url\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"s2\"\u003E\u0026quot;https://oauth2accesstoken:\u003C/span\u003E\u003Cspan class=\"k\"\u003E$(\u003C/span\u003Egcloud\u003Cspan class=\"w\"\u003E \u003C/span\u003Eauth\u003Cspan class=\"w\"\u003E \u003C/span\u003Eprint-access-token\u003Cspan class=\"k\"\u003E)\u003C/span\u003E\u003Cspan class=\"s2\"\u003E@us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/\u0026quot;\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003Etorch_tpu\n\n\u003Cspan class=\"c1\"\u003E# 3. Install optional utilities\u003C/span\u003E\npip\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003Eportpicker\u003Cspan class=\"w\"\u003E \u003C/span\u003Emarimo\u003Cspan class=\"w\"\u003E \u003C/span\u003Escikit-learn\u003Cspan class=\"w\"\u003E \u003C/span\u003Epandas\n\n\u003Cspan class=\"c1\"\u003E#4. Optional for Pallas kernels\u003C/span\u003E\npip\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003Ejax\n\n\u003Cspan class=\"c1\"\u003E#5. Optional for xProf\u003C/span\u003E\npip\u003Cspan class=\"w\"\u003E \u003C/span\u003Einstall\u003Cspan class=\"w\"\u003E \u003C/span\u003Etensorboard\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\n\u003C/details\u003E\n\n\u003Cdiv id=\"tutorials\" class=\"portal-section\"\u003E\n    \u003Cdiv class=\"section-header\"\u003E\n        \u003Cdiv class=\"section-badge blue\"\u003E\ud83c\udf93\u003C/div\u003E\n        \u003Ch2 class=\"section-title\"\u003ETutorials\u003C/h2\u003E\n    \u003C/div\u003E\n    \u003Cp class=\"section-subtitle\"\u003EStep-by-step lessons that teach core concepts hands-on.\u003C/span\u003E\n    \u003Cdiv class=\"card-grid\"\u003E\n        \u003Ca href=\"?file=get_started_tpu.py\" class=\"portal-card blue\"\u003E\n            \u003Cspan class=\"card-num\"\u003E1\u003C/span\u003E\n            \u003Cdiv class=\"card-body\"\u003E\n                \u003Cdiv class=\"card-title\"\u003EGet Started with TorchTPU\u003C/div\u003E\n                \u003Cdiv class=\"card-desc\"\u003EDevice init, deferred execution, and materialization\u003C/div\u003E\n            \u003C/div\u003E\n        \u003C/a\u003E\n        \u003Ca href=\"?file=porting_vit_mnist.py\" class=\"portal-card blue\"\u003E\n            \u003Cspan class=\"card-num\"\u003E2\u003C/span\u003E\n            \u003Cdiv class=\"card-body\"\u003E\n                \u003Cdiv class=\"card-title\"\u003EYour First Port (ViT on MNIST)\u003C/div\u003E\n                \u003Cdiv class=\"card-desc\"\u003EGhosting shims, Linear patching, and pure-tensor pipelines\u003C/div\u003E\n            \u003C/div\u003E\n        \u003C/a\u003E\n        \u003Ca href=\"?file=debu
